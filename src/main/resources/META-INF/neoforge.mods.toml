modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/SunkenInTime/minecraft-orthogonal-map/issues"

[[mods]]
modId = "gregedcolonies"
version = "${version}"
displayName = "GregedColonies"
description = "A ray-traced, angled voxel map and minimap."
authors = "Dara Adedeji"
displayURL = "https://modrinth.com/mod/gregedcolonies-map"
logoFile = "assets/gregedcolonies/icon.png"

[[mixins]]
config = "gregedcolonies.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.gregedcolonies]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"

[[dependencies.gregedcolonies]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
